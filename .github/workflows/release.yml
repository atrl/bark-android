name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK and AAB
    runs-on: ubuntu-latest
    env:
      BARK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BARK_ANDROID_KEYSTORE_PASSWORD }}
      BARK_ANDROID_KEY_ALIAS: ${{ secrets.BARK_ANDROID_KEY_ALIAS }}
      BARK_ANDROID_KEY_PASSWORD: ${{ secrets.BARK_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          BARK_ANDROID_KEYSTORE_BASE64: ${{ secrets.BARK_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$BARK_ANDROID_KEYSTORE_BASE64"
          test -n "$BARK_ANDROID_KEYSTORE_PASSWORD"
          test -n "$BARK_ANDROID_KEY_ALIAS"
          test -n "$BARK_ANDROID_KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$BARK_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.keystore"
          echo "BARK_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.keystore" >> "$GITHUB_ENV"

      - name: Load optional Firebase app configuration
        env:
          BARK_FIREBASE_CONFIG_JSON: ${{ secrets.BARK_FIREBASE_CONFIG_JSON }}
        shell: bash
        run: |
          if [ -n "$BARK_FIREBASE_CONFIG_JSON" ]; then
            umask 077
            printf '%s' "$BARK_FIREBASE_CONFIG_JSON" > "$RUNNER_TEMP/google-services.json"
            echo "BARK_FIREBASE_CONFIG=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
          fi

      - name: Run tests
        run: ./gradlew --console=plain :core:test :app:testDebugUnitTest

      - name: Build signed release APK and AAB
        run: ./gradlew --console=plain :app:assembleRelease :app:bundleRelease -x lintVitalAnalyzeRelease

      - name: Check out pinned release verification tool
        uses: actions/checkout@v4
        with:
          repository: atrl/bark-server
          ref: a14c4970ff1614a2a9d7a5483c7d8b0e570fcfec
          path: tools/bark-release
          persist-credentials: false

      - name: Prepare verified automatic update bundle
        run: |
          python3 tools/bark-release/deploy/nas/prepare-android-release.py prepare \
            --apk app/build/outputs/apk/release/app-release.apk \
            --output-dir app/build/outputs/update-release \
            --release-notes-file RELEASE_NOTES.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path("app/build/outputs/update-release/stable.json").read_text())
          if os.environ["GITHUB_REF"].startswith("refs/tags/"):
              assert os.environ["GITHUB_REF_NAME"] == "v" + manifest["version_name"], "Release tag must match the APK version"
          PY

      - name: Upload verified update bundle
        uses: actions/upload-artifact@v4
        with:
          name: bark-android-update-release
          path: app/build/outputs/update-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: bark-android-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: bark-android-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/update-release/*
            app/build/outputs/bundle/release/*.aab
          fail_on_unmatched_files: true
